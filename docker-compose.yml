services:
  xray-checker:
    image: kutovoys/xray-checker
    container_name: postq_xray_checker
    restart: unless-stopped
    environment:
      # Routed through postq-vpn-status's /api/subscription-proxy, not fetched
      # directly — see that route's comment for why (xray-checker#188 stopgap).
      - SUBSCRIPTION_URL=http://postq-vpn-status:3000/api/subscription-proxy
      - "SUBSCRIPTION_HEADERS=X-Subscription-Proxy-Secret: ${SUBSCRIPTION_PROXY_SECRET}"
      - METRICS_PROTECTED=true
      - METRICS_USERNAME=${XRAY_CHECKER_USER}
      - METRICS_PASSWORD=${XRAY_CHECKER_PASS}
      - WEB_PUBLIC=true
      - CHECK_INTERVAL=300
      - CHECK_URL=https://www.gstatic.com/generate_204
    volumes:
      - ./geo:/app/geo
    depends_on:
      postq-vpn-status:
        condition: service_healthy
    networks:
      - internal
      - caddy_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2112/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
  postq-vpn-status:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postq_vpn_status
    restart: unless-stopped
    environment:
      - XRAY_CHECKER_URL=http://xray-checker:2112
      - XRAY_CHECKER_USER=${XRAY_CHECKER_USER}
      - XRAY_CHECKER_PASS=${XRAY_CHECKER_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - HISTORY_DB_PATH=/app/data/history.db
      - SUBSCRIPTION_URL=${SUBSCRIPTION_URL}
      - SUBSCRIPTION_PROXY_SECRET=${SUBSCRIPTION_PROXY_SECRET}
    volumes:
      - history-data:/app/data
    networks:
      - internal
      - caddy_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  internal:
    internal: true
  caddy_net:
    external: true
volumes:
  history-data:
